# documenter — writes up a finished change, from the diff. "Document only" is
# a rule the boundary enforces, not a line in a prompt the model may drift
# from: it may write Markdown, and nothing else.
purpose: Write up the change that was just made, from the diff; document only.
color: "#e879f9"
writes:
  - app_docs/
  - docs/
  - "**/*.md"
  - "*.md"
