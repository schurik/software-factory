# ── the harness-agnostic middle of the config ────────────────────────────────
#
# Everything below is the same whichever harness the roster runs on: where the
# trace goes, how a run's worktree and branch are handled, and the two triggers
# that can start runs without an engineer at the keyboard. `install.py` (and
# `make_config.py`) drop it between the chosen harness's `defaults:` block and
# its `agents:` roster — one generated file, three source files.

observability:
  db: adws/adw_data/sssf.db        # tracer writes here directly; the UI polls it
  poll_ms: 500                     # visualizer live-poll cadence

# Every run gets its own git worktree on its own branch, cut from a base ref
# pinned at run start. The engineer's working tree is never touched, two runs
# can execute at once without colliding, and a failed run leaves its state
# somewhere you can open instead of somewhere in the way.
#
# Isolation, not a sandbox: an agent with `bash` can still leave the worktree.
# adw_modules/permissions.py is the boundary, and it measures this tree.
worktree:
  enabled: true
  dir: .sssf-worktrees             # relative to the main checkout; gitignored
  branch_prefix: "sssf/"           # the run's branch is <prefix><adw_id>[-<slug>]
  # A branch named only for its run says nothing about what it was for. On, the
  # run's issue title (or its prompt's first line) is slugged onto the end:
  #   sssf/a1b2c3d4-42-floor-euro-rounds-down
  # The adw_id stays FIRST so everything that reads a branch back — the review
  # chain, `just worktrees` — still finds it. false restores <prefix><adw_id>.
  branch_slug: true
  base_ref: ""                     # "" = whatever the main checkout has checked out
  # A clean worktree is a redundant copy of a branch that is kept, so an
  # accepted run drops it. A failed or killed run keeps its worktree — that is
  # where you go to see what happened — and so does anything holding
  # uncommitted work, whatever the outcome.
  keep_on_success: false
  # How a run's branch gets back to the base branch. Repositories disagree
  # about this, so it is config, not code.
  integration:
    mode: merge                    # none | merge | pr
    merge_flags: ["--no-ff"]       # mode: merge — the run stays legible as one merge
    remote: origin                 # mode: pr — where the branch is pushed
    # mode: pr — also run pr_command after pushing. Repeatable either way: once
    # a branch is on the remote, every later commit phase in that session pushes
    # to it, and integrating again updates the pull request rather than opening
    # a second one. Nothing publishes a branch on its own.
    open_pr: false
    pr_command: ["gh", "pr", "create", "--fill"]
    # Prepended to --body, rendered with {adw_id}, {branch}, {base_ref} and — on
    # an issue-triggered run — {issue_number} and {issue_url}. An issue-triggered
    # run always appends its own `Closes #<n>` after this, so the forge closes
    # the issue on merge without operators having to spell that out here.
    # NOTE: gh rejects --fill together with an explicit body — the integrate
    # phase drops --fill on its own the moment there is a body to send.
    pr_body_template: ""

# Where work items come from, and which chain each label asks for. OFF by
# default: this is the one path where the prompt is written by whoever can file
# an issue rather than by the engineer at the keyboard, so a repository opts in
# to it deliberately.
#
# The trigger is `<skill>/scripts/issue_watch.py`, run by cron or by hand — it
# sits ABOVE the factory, not inside it. The label is the queue; the flip from
# queued to running is the claim — a file lock next to the db is what makes it
# exclusive, because the forge has no conditional label change.
issues:
  enabled: false
  # WHICH REPO is watched. "" resolves once at startup from the origin remote of
  # this checkout. Set it explicitly for cron — a scheduler has an arbitrary
  # working directory, and a watcher that silently polls the wrong project looks
  # exactly like one with nothing to do. A tracker that is not the forge (Jira,
  # Linear) has no remote to infer from and MUST set this.
  project: ""                      # e.g. "acme/widgets"
  # Commands, not API calls, for the reason pr_command already gives: the forge
  # CLI is installed and authenticated in your shell already. glab, jira and
  # linear fit the same four verbs.
  fetch_command:   ["gh", "issue", "view"]
  list_command:    ["gh", "issue", "list"]
  comment_command: ["gh", "issue", "comment"]
  state_command:   ["gh", "issue", "edit"]
  # The Development panel on an issue — the only thing that says "a run has
  # this" BEFORE a pull request exists. GitHub creates linked branches and never
  # links existing ones, so an issue-triggered run's branch is created HERE, by
  # the forge, and the worktree is cut from it. Anything that stops that (no
  # remote, no auth, a tracker that is not GitHub) leaves the run on a local
  # branch of the same name and says so in the run's first line.
  link_branch: true
  develop_command: ["gh", "issue", "develop"]
  # label -> ADW. THE LABEL IS THE AUTHORIZATION: a human applied it, and the
  # watcher never looks at an issue that does not carry one. An empty route map
  # means nothing ever launches, which is the safe default.
  route: {}
  # route:
  #   "sssf:build": adws/adw_issue_sdlc.py
  #   "sssf:scout": adws/adw_issue_scout.py
  states:                          # the label state machine, and the lock
    queued:  "sssf:queued"
    running: "sssf:running"
    done:    "sssf:done"
    failed:  "sssf:failed"
  # [] accepts every issue author, because the person who applied the routing
  # label is then the only authorization. Narrow it where anyone can label.
  trusted_authors: []
  max_concurrent: 2                # bounds runs in flight, not spend
  # An issue-triggered run may not move the base branch, whatever
  # worktree.integration.mode says. Enforced in integration.py, not here.
  force_pr: true

# Review feedback on the factory's OWN pull requests, answered in the session
# that opened them. OFF by default, for the reason `issues` is: the text driving
# the agents is written by whoever can review, not by the engineer at the
# keyboard.
#
# The trigger is `<skill>/scripts/pr_watch.py`, or `just pr-review <n>` by hand.
# THE UNRESOLVED THREAD IS THE QUEUE — there is no label to claim and no state
# file, because the forge already tracks which asks are outstanding and shows it
# to the reviewer who wrote them. A run answers a thread and resolves it, so the
# queue empties itself.
pull_requests:
  enabled: false
  project: ""                      # "" = resolved once from origin, as in issues
  # Review THREADS are the one thing `gh pr view --json` cannot return — it
  # gives issue-level comments and review bodies, never the inline threads where
  # the asks actually are, and never `isResolved`. So a pull request is read
  # through graphql (one query: state AND threads, one consistent snapshot), and
  # replies and resolves are written back the same way.
  list_command:    ["gh", "pr", "list"]
  comment_command: ["gh", "pr", "comment"]
  state_command:   ["gh", "pr", "edit"]
  graphql_command: ["gh", "api", "graphql"]
  # [] accepts everyone: being able to review this repository's pull requests is
  # itself the authorization. Narrow it where that is not true — anyone can
  # comment on a public repository's pull request.
  trusted_reviewers: []
  # Bots whose comments are never work an agent can do. The factory's own
  # comments are skipped regardless, or a run would answer its own answer.
  ignore_authors: []               # e.g. ["codecov[bot]", "github-actions[bot]"]
  reply_to_threads: true           # answer in the thread before resolving it
  resolve_threads: true            # ...and only when the run actually went green
  max_threads: 20                  # bounds the prompt; a bigger review is a conversation
  max_concurrent: 2
  # A merged or closed pull request ends its session: pr_watch stops a review run
  # still working that branch and releases its worktree. The BRANCH is never
  # deleted — that belongs to whoever merged.
  reap_merged: true
  states:
    # The only label this path uses, and it stops one specific loop: a run that
    # ends red leaves its threads open, which is exactly what launched it. A
    # human removing this label is the restart.
    failed: "sssf:pr-failed"
