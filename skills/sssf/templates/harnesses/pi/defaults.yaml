# sssf.config.yaml — the factory's agent roster. One agent, one prompt, one purpose.
#
# GENERATED at install time for the **pi** harness, out of three files in the skill:
#   harnesses/pi/defaults.yaml  +  config/base.yaml  +  harnesses/pi/agents.yaml
# It is yours the moment it is stamped — edit it here, never back inside the skill.
#
# `harness: pi` runs `pi -p --mode json`. Its `model` is `provider/model-id`, resolved
# against `pi --list-models`, and the provider half decides which key must be in `.env`.
# Another harness's agent can be added to this roster by hand (`harness: claude_code`,
# with a model of that shape) — one chain may mix them, and everything downstream of the
# agent call cannot tell which ran a phase. What is NOT shared: `model`, `thinking`,
# `tools` and `harness_engineering` each mean something harness-specific, and validation
# applies the right rule per agent. The prompts in adws/adw_data/prompt_engineering/ were
# stamped for pi too — see references/harnesses.md before mixing.
defaults:
  harness: pi
  model: google/gemini-3.6-flash   # provider/id — a bare pattern is ambiguous across
                                   # providers, and resolution raises rather than guessing.
  thinking: medium                 # off | minimal | low | medium | high | xhigh | max
                                   # pi honors this when the model is registered with
                                   # `reasoning: true`; on other models it is inert.
  harness_engineering: []          # pi: extension file paths, loaded with `pi -e <file.ts>`
  # Roster-wide allowlist; any agent may override with its own list.
  # NOTE: --tools filters extension and custom tools too, not just builtins. An agent
  # whose harness_engineering extension registers a tool MUST name that tool in its own
  # tools list — otherwise the extension loads and its tool is silently filtered out.
  tools:
    - read                         # read file contents
    - bash                         # execute bash commands
    - edit                         # find/replace edits
    - write                        # create/overwrite files
    - grep                         # search file contents  (pi default: OFF)
    - find                         # find files by glob     (pi default: OFF)
    - ls                           # list directories       (pi default: OFF)
  # Per-harness settings, keyed by harness name, and an agent inherits only the block
  # for the harness it runs on — key by key, so overriding one setting never drops the
  # rest. pi takes none today (it is configured through argv and the environment:
  # PI_PATH, PI_MODELS_PATH, and the provider key its model names), and an unknown key
  # here is a validation error rather than a setting that quietly does nothing.
  harness_options:
    pi: {}
  # Off-limits to every agent that does not name them in its own `writes`.
  # `tools` alone cannot protect these: bash runs `git checkout`, and write
  # reaches any path. An agent must not be able to edit the machinery that
  # decides whether its own work passed. Enforced in adw_modules/permissions.py.
  #
  # `writes:` per agent says what it may change IN THE REPO. It never restricts
  # the session runtime under data_dir — context_handoff/, envelopes, prompts,
  # raw output. Every agent can always write its own report; `writes: []` means
  # read-only with respect to the repo, not mute.
  protected_files:
    - adws/adw_modules/
    - adws/adw_sssf_config/
    - adws/adw_*.py
  data_dir: adws/adw_data          # runtime home: {data_dir}/sessions/{adw_id}/{agent_name}/

