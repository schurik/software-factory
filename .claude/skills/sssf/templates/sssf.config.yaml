# sssf.config.yaml — the factory's agent roster. One agent, one prompt, one purpose.
#
# Two coding-agent backends, selectable PER AGENT, and a chain may mix them:
#   coding_agent: pi           `pi -p --mode json`   — model is provider/id, needs that
#                              provider's API key in .env
#   coding_agent: claude_code  `claude -p`           — model is an alias (opus, sonnet,
#                              haiku) or a full id, and the CLI brings its own auth, so
#                              a Claude subscription needs no key at all
#
# The keys below that are NOT shared between the two are called out where they appear:
# `model`, `thinking`, `tools` and `harness_engineering` each mean something
# backend-specific, and validation applies the right rule per agent rather than one
# rule to both.
defaults:
  coding_agent: pi
  model: google/gemini-3.6-flash   # pi: provider/id — a bare pattern is ambiguous across
                                   # providers. claude_code: an alias or full model id, and
                                   # a provider/id pattern is REJECTED at validation, so a
                                   # claude_code agent must override this.
  thinking: medium                 # off | minimal | low | medium | high | xhigh | max
                                   # claude_code maps this to --effort, where `off` and
                                   # `minimal` have no equivalent and both collapse to `low`
                                   # (warned once per run, visible in the trace).
  harness_engineering: []          # pi: extension file paths, loaded with -e
                                   # claude_code: `mcp:<file.json>`, `agents:<json-or-file>`
                                   # or `plugin:<dir-or-zip>`. NOT interchangeable — a pi
                                   # .ts extension on a claude_code agent fails validation.
  # Roster-wide allowlist; any agent may override with its own list.
  # NOTE: --tools filters extension and custom tools too, not just builtins. An agent
  # whose harness_engineering extension registers a tool MUST name that tool in its own
  # tools list — otherwise the extension loads and its tool is silently filtered out.
  #
  # pi's names are the vocabulary; the Claude Code backend maps them (read->Read,
  # find->Glob, ls->Glob — Claude Code has no `ls`, and mapping it to Bash would hand a
  # read-only agent a shell). A claude_code agent may name Claude Code tools directly
  # instead. A name that maps to NEITHER is a validation error, never a silent drop: an
  # agent that quietly lost a capability looks like a model that gave up.
  tools:
    - read                         # read file contents
    - bash                         # execute bash commands
    - edit                         # find/replace edits
    - write                        # create/overwrite files
    - grep                         # search file contents  (pi default: OFF)
    - find                         # find files by glob     (pi default: OFF)
    - ls                           # list directories       (pi default: OFF)
  # Off-limits to every agent that does not name them in its own `writes`.
  # `tools` alone cannot protect these: bash runs `git checkout`, and write
  # reaches any path. An agent must not be able to edit the machinery that
  # decides whether its own work passed. Enforced in adw_modules/permissions.py.
  #
  # `writes:` per agent says what it may change IN THE REPO. It never restricts
  # the session runtime under data_dir — context_handoff/, envelopes, prompts,
  # raw output. Every agent can always write its own report; `writes: []` means
  # read-only with respect to the repo, not mute.
  protected_files:
    - adws/adw_modules/
    - adws/adw_sssf_config/
    - adws/adw_*.py
  data_dir: adws/adw_data          # runtime home: {data_dir}/sessions/{adw_id}/{agent_name}/

  # Claude Code only; ignored by pi agents. Any agent may override the whole block.
  #
  # A default `claude -p` discovers whatever the operator happens to have — CLAUDE.md,
  # skills, plugins, hooks, MCP servers — so the same roster behaves differently on two
  # machines. That is the failure this factory exists to remove, so it is pinned off here.
  # It is CONFIG, not code: a repository that genuinely wants its own CLAUDE.md loaded
  # sets safe_mode: false, and that is its call.
  claude_code:
    safe_mode: true                # --safe-mode: no CLAUDE.md, skills, plugins, hooks, MCP
                                   # servers or custom agents. Auth still works, so a
                                   # subscription-authenticated roster keeps running.
                                   # Turn it OFF for an agent that uses harness_engineering
                                   # — safe mode suppresses exactly those things.
    bare: false                    # --bare is stricter still, but forces ANTHROPIC_API_KEY
                                   # auth and never reads OAuth or the keychain — turning it
                                   # on takes a subscription-only setup offline.
    setting_sources: []            # user | project | local — empty ignores all settings files
    strict_mcp_config: true        # only MCP servers this config passes explicitly
    # A non-interactive run has to answer its own permission prompts. That is only
    # acceptable because two other things are true: adw_modules/permissions.py
    # fingerprints the tree before the call and rolls back every write outside the
    # agent's `writes:` allowlist afterwards, and the run happens in its own worktree.
    # The factory is not careless here — it verifies after the fact, like everything else.
    # The CLI REFUSES bypassPermissions when running as root; use acceptEdits there, and
    # know that acceptEdits silently denies whatever it would otherwise have prompted for.
    permission_mode: bypassPermissions
    add_dirs: []                   # extra --add-dir roots. The run's worktree and the
                                   # session runtime are added automatically.
    max_budget_usd: 0              # per-call ceiling; 0 = none

observability:
  db: adws/adw_data/sssf.db        # tracer writes here directly; the UI polls it
  poll_ms: 500                     # visualizer live-poll cadence

# Every run gets its own git worktree on its own branch, cut from a base ref
# pinned at run start. The engineer's working tree is never touched, two runs
# can execute at once without colliding, and a failed run leaves its state
# somewhere you can open instead of somewhere in the way.
#
# Isolation, not a sandbox: an agent with `bash` can still leave the worktree.
# adw_modules/permissions.py is the boundary, and it measures this tree.
worktree:
  enabled: true
  dir: .sssf-worktrees             # relative to the main checkout; gitignored
  branch_prefix: "sssf/"           # the run's branch is <prefix><adw_id>
  base_ref: ""                     # "" = whatever the main checkout has checked out
  # A clean worktree is a redundant copy of a branch that is kept, so an
  # accepted run drops it. A failed or killed run keeps its worktree — that is
  # where you go to see what happened — and so does anything holding
  # uncommitted work, whatever the outcome.
  keep_on_success: false
  # How a run's branch gets back to the base branch. Repositories disagree
  # about this, so it is config, not code.
  integration:
    mode: merge                    # none | merge | pr
    merge_flags: ["--no-ff"]       # mode: merge — the run stays legible as one merge
    remote: origin                 # mode: pr — where the branch is pushed
    open_pr: false                 # mode: pr — also run pr_command after pushing
    pr_command: ["gh", "pr", "create", "--fill"]
    # Passed as --body, rendered with {adw_id}, {branch}, {base_ref} and — on an
    # issue-triggered run — {issue_number} and {issue_url}. `Closes #<n>` here is
    # what makes such a run close its own issue when the PR merges; the forge
    # does it, nothing in the factory has to. NOTE: gh rejects --fill together
    # with an explicit body, so drop --fill above if you set this.
    pr_body_template: ""

# Where work items come from, and which chain each label asks for. OFF by
# default: this is the one path where the prompt is written by whoever can file
# an issue rather than by the engineer at the keyboard, so a repository opts in
# to it deliberately.
#
# The trigger is `<skill>/scripts/issue_watch.py`, run by cron or by hand — it
# sits ABOVE the factory, not inside it. The label is the queue; the flip from
# queued to running is the lock.
issues:
  enabled: false
  # WHICH REPO is watched. "" resolves once at startup from the origin remote of
  # this checkout. Set it explicitly for cron — a scheduler has an arbitrary
  # working directory, and a watcher that silently polls the wrong project looks
  # exactly like one with nothing to do. A tracker that is not the forge (Jira,
  # Linear) has no remote to infer from and MUST set this.
  project: ""                      # e.g. "acme/widgets"
  # Commands, not API calls, for the reason pr_command already gives: the forge
  # CLI is installed and authenticated in your shell already. glab, jira and
  # linear fit the same four verbs.
  fetch_command:   ["gh", "issue", "view"]
  list_command:    ["gh", "issue", "list"]
  comment_command: ["gh", "issue", "comment"]
  state_command:   ["gh", "issue", "edit"]
  # label -> ADW. THE LABEL IS THE AUTHORIZATION: a human applied it, and the
  # watcher never looks at an issue that does not carry one. An empty route map
  # means nothing ever launches, which is the safe default.
  route: {}
  # route:
  #   "sssf:build": adws/adw_issue_sdlc.py
  #   "sssf:scout": adws/adw_issue_scout.py
  states:                          # the label state machine, and the lock
    queued:  "sssf:queued"
    running: "sssf:running"
    done:    "sssf:done"
    failed:  "sssf:failed"
  # [] accepts every issue author, because the person who applied the routing
  # label is then the only authorization. Narrow it where anyone can label.
  trusted_authors: []
  max_concurrent: 2                # bounds runs in flight, not spend
  # An issue-triggered run may not move the base branch, whatever
  # worktree.integration.mode says. Enforced in integration.py, not here.
  force_pr: true

# The starter roster runs entirely on pi. To move ONE agent to Claude Code, give it a
# backend and a model of the right shape — the rest of its entry is unchanged, and it
# can hand its envelope to a pi agent in the same chain:
#
#   - name: reviewer
#     coding_agent: claude_code
#     model: sonnet                  # alias or full id — NEVER provider/id
#     thinking: high                 # -> --effort high
#     claude_code:                   # optional; overrides the defaults block above
#       permission_mode: bypassPermissions
#
agents:
  - name: planner
    model: fireworks/accounts/fireworks/models/kimi-k3
    thinking: high
    color: "#a78bfa"                 # optional hex — the agent's lane color in the visualizer
    purpose: Turn a request into a plan the builder can implement without asking questions.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/planner/system.md
      user: adws/adw_data/prompt_engineering/planner/user.md
    harness_engineering:
      - adws/adw_data/harness_engineering/subagents.ts    # registers the four subagent_* tools below
    writes:                        # the plan is the only thing it may leave in the repo
      - specs/
    tools:                         # full recon + write for plan.md; no edit — the planner never touches repo files
      - read
      - grep
      - find
      - ls
      - bash
      - write
      - subagent_create            # extension tools MUST be named here or they are filtered out
      - subagent_continue
      - subagent_list
      - subagent_remove

  - name: builder
    color: "#22d3ee"
    purpose: Implement the plan exactly; report every changed file in the envelope.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/builder/system.md
      user: adws/adw_data/prompt_engineering/builder/user.md
    # No `writes` key: unrestricted, and the only agent that is. It still cannot
    # touch defaults.protected_files — the builder does not get to edit its own grader.
    tools:                         # the only agent that mutates the repo — everything on
      - read
      - grep
      - find
      - ls
      - bash
      - edit
      - write

  - name: scout
    color: "#fbbf24"
    purpose: Find and report where things live; change nothing.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/scout/system.md
      user: adws/adw_data/prompt_engineering/scout/user.md
    harness_engineering:
      - adws/adw_data/harness_engineering/subagents.ts    # registers the four subagent_* tools below
    writes: []                     # read-only, and now actually read-only: its findings
                                   # go to context_handoff/, which is runtime, not the repo
    tools:                         # search-heavy recon; write only so scout_findings.md lands without a bash heredoc
      - read
      - grep
      - find
      - ls
      - bash
      - write
      - subagent_create            # extension tools MUST be named here or they are filtered out
      - subagent_continue
      - subagent_list
      - subagent_remove

  # No tester agent: running the suite is a known command, so it is a kind="code"
  # phase over adw_modules/quality.py. See SKILL.md hard rule 8.

  - name: reviewer
    model: openai/gpt-5.6-terra
    thinking: high
    color: "#fb7185"
    purpose: Confirm that what was built is what was asked for; change nothing.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/reviewer/system.md
      user: adws/adw_data/prompt_engineering/reviewer/user.md
    writes: []                     # a reviewer that cannot fix cannot quietly fix — the
                                   # claim the tool list only implied, now enforced
    tools:                         # full read surface; write only for review.md, no edit
      - read
      - grep
      - find
      - ls
      - bash
      - write

  - name: documenter
    model: openai/gpt-5.6-luna
    color: "#e879f9"
    purpose: Write up the change that was just made, from the diff; document only.
    prompt_engineering:
      system: adws/adw_data/prompt_engineering/documenter/system.md
      user: adws/adw_data/prompt_engineering/documenter/user.md
    writes:                        # documentation only — "document only" is a rule now,
      - app_docs/                  # not a line in a prompt the model may drift from.
      - docs/                      # Markdown anywhere, because docs live next to the
      - "**/*.md"                  # code they describe as often as in a docs folder.
      - "*.md"
    tools:                         # reads the diff and the code; writes/edits documentation only
      - read
      - grep
      - find
      - ls
      - bash
      - write
      - edit
